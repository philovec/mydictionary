<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>語学・学習用 My辞書</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; }
        .hidden { display: none !important; }
        .screen { padding: 20px; border: 1px solid #ccc; border-radius: 8px; }
        
        /* タブデザイン */
        .tabs { display: flex; margin-bottom: 20px; border-bottom: 2px solid #007bff; }
        .tab-btn { flex: 1; padding: 10px; cursor: pointer; background: #f8f9fa; border: none; font-size: 16px; }
        .tab-btn.active { background: #007bff; color: white; font-weight: bold; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        /* フォーム系 */
        input, select, textarea { width: 100%; padding: 8px; margin: 8px 0; box-sizing: border-box; }
        textarea { height: 100px; }
        button { padding: 10px 15px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        
        /* 履歴リストデザイン */
        .history-item { border-bottom: 1px solid #eee; padding: 10px 0; }
        .history-term { font-weight: bold; color: #333; font-size: 1.1em; }
        .history-desc { color: #555; margin-top: 5px; }
    </style>
</head>
<body>

    <!-- ログイン画面 -->
    <div id="login-screen" class="screen">
        <h2>My辞書 ログイン</h2>
        <input type="password" id="login-password" placeholder="パスワードを入力">
        <button id="login-btn">ログイン</button>
    </div>

    <!-- メイン画面 -->
    <div id="main-screen" class="screen hidden">
        <div class="tabs">
            <button class="tab-btn active" data-target="search-tab">検索・登録</button>
            <button class="tab-btn" data-target="history-tab">履歴・学習</button>
        </div>

        <!-- 検索タブ -->
        <div id="search-tab" class="tab-content active">
            <input type="text" id="search-input" placeholder="用語を入力 (例: Python)">
            <button id="search-btn">検索</button>

            <div id="search-result-area" class="hidden" style="margin-top: 20px; padding-top: 20px; border-top: 1px dashed #ccc;">
                <p id="status-msg" style="font-weight:bold;"></p>
                <label>用語</label>
                <input type="text" id="result-term">
                <label>意味</label>
                <textarea id="result-explanation"></textarea>
                <label>種別</label>
                <select id="result-kind"></select>
                <br><br>
                <button id="save-btn">保存する</button>
                <button id="cancel-btn" style="background:#6c757d;">キャンセル</button>
            </div>
        </div>

        <!-- 履歴タブ -->
        <div id="history-tab" class="tab-content">
            <select id="history-kind"></select>
            <button id="shuffle-btn" class="hidden" style="background:#28a745;">シャッフル</button>
            
            <div id="history-list" style="margin-top: 20px;"></div>
            <button id="load-more-btn" class="hidden" style="margin-top: 15px; width: 100%;">次の50件を表示</button>
        </div>
    </div>

<script src="app.js"></script>
</body>
</html>
